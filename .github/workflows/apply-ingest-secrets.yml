name: Apply ingest key to prod env (manual)

# Кладёт INGEST_GATEWAY_KEY (право присылать посты в /api/ingest/posts, D-093) из
# GitHub secrets в env-файл сервиса на проде и рестартит юнит. Источник значения —
# GitHub secrets (как у Казанской, выбор владельца 02.09): тот же секрет читает
# deploy-prod.yml для зеркала в vault и grant'а Сарафану, значит источник один.
#
# Ярус `ask` (пишет прод-env, рестарт). Идемпотентно: строка есть и совпадает —
# ничего не делает; есть и отличается — заменяет (ротация). Значение не печатается.
# INGEST_PUBLISH_KEY тем же шагом, если задан; на старте не задан намеренно
# (черновик по умолчанию, публикует человек).

on:
  workflow_dispatch:

concurrency:
  group: sabantuy-prod-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_PORT" ]; then
            echo "::error::Заданы не все: secrets.SSH_PRIVATE_KEY / secrets.DEPLOY_SSH_HOST / secrets.DEPLOY_SSH_PORT"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_sabantuy
          chmod 600 ~/.ssh/id_ed25519_sabantuy
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host sabantuy
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_sabantuy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Write INGEST_* to prod env + restart
        env:
          INGEST_GATEWAY_KEY: ${{ secrets.INGEST_GATEWAY_KEY }}
          INGEST_PUBLISH_KEY: ${{ secrets.INGEST_PUBLISH_KEY }}
        run: |
          set -e
          if [ -z "$INGEST_GATEWAY_KEY" ]; then
            echo "::error::secrets.INGEST_GATEWAY_KEY не задан — класть нечего"
            exit 1
          fi
          umask 077
          {
            printf 'INGEST_GATEWAY_KEY=%s\n' "$INGEST_GATEWAY_KEY"
            [ -n "$INGEST_PUBLISH_KEY" ] && printf 'INGEST_PUBLISH_KEY=%s\n' "$INGEST_PUBLISH_KEY"
            true
          } > ingest.env
          scp -q ingest.env sabantuy:/tmp/ingest.env
          rm -f ingest.env
          ssh sabantuy 'sudo bash -s' <<'REMOTE'
          set -e
          ENV=/etc/sabantuy/sabantuy.env
          changed=0
          while IFS='=' read -r k v; do
            [ -n "$k" ] || continue
            if grep -q "^$k=" "$ENV"; then
              if [ "$(grep "^$k=" "$ENV" | head -1)" = "$k=$v" ]; then
                echo "$k: уже стоит, не изменён"
              else
                # Ротация: заменить значение на месте, файл целиком не переписываем.
                sed -i "s|^$k=.*|$k=$v|" "$ENV"
                echo "$k: заменён"
                changed=1
              fi
            else
              printf '%s=%s\n' "$k" "$v" >> "$ENV"
              echo "$k: добавлен"
              changed=1
            fi
          done < /tmp/ingest.env
          rm -f /tmp/ingest.env
          chown root:valstan "$ENV"
          chmod 640 "$ENV"
          if [ "$changed" = 1 ]; then
            systemctl restart sabantuy
            echo "юнит перезапущен"
          fi
          sleep 4
          # Приёмка по контракту D-093: без ключа маршрут отвечает 401 (не 503, не 404).
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST \
            -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:3000/api/ingest/posts)
          echo "POST /api/ingest/posts без ключа → $code (ожидалось 401)"
          [ "$code" = "401" ]
          REMOTE
