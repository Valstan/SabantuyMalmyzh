name: Attach orphan photos to gallery (manual, ask)

# Переносит медиа-сироты (фото из постов ВК, скачанные 05.07 и не привязанные
# ни к чему) в альбом галереи «sabantuy-2023». НЕ удаляет файлы — лишние копии
# одинаковых кадров просто не публикуются.
#
# mode=plan — только отчёт (по умолчанию). mode=apply — реально прикрепить.
# Мутация живых прод-данных → ярус ask: apply запускает человек.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка/ревизия с скриптом (обязательно — код лежит в ветке)'
        required: true
        default: 'main'
        type: string
      mode:
        description: 'plan — отчёт; apply — прикрепить к альбому'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      album:
        description: 'slug альбома-цели'
        required: false
        default: 'sabantuy-2023'
        type: string
      album_id:
        description: 'id альбома'
        required: false
        default: '1'
        type: string

concurrency:
  group: sabantuy-prod-ssh
  cancel-in-progress: false

permissions:
  contents: read

env:
  # G315: глушим stderr ssh/scp-клиента (хост не должен уезжать в публичный лог)
  BASH_ENV: ${{ github.workspace }}/.github/scripts/ssh-quiet.sh

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_sabantuy
          chmod 600 ~/.ssh/id_ed25519_sabantuy
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host sabantuy
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_sabantuy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config
      - name: Run on box
        run: |
          set -e
          ssh sabantuy 'bash -s' "${{ inputs.ref }}" "${{ inputs.mode }}" "${{ inputs.album }}" "${{ inputs.album_id }}" <<'REMOTE'
          set -euo pipefail
          REF="$1"; MODE="$2"; ALBUM="${3:-sabantuy-2023}"; AID="${4:-1}"
          BASE=${{ secrets.DEPLOY_BASE }}
          REPO="$BASE/repo"
          GIT_SSH="ssh -i $HOME/.ssh/github_sabantuy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          if [ ! -d "$REPO/.git" ]; then
            GIT_SSH_COMMAND="$GIT_SSH" git clone git@github.com:Valstan/SabantuyMalmyzh.git "$REPO"
          fi
          cd "$REPO"
          GIT_SSH_COMMAND="$GIT_SSH" git fetch --depth 1 origin "$REF"
          git checkout -f FETCH_HEAD

          corepack prepare pnpm@10.15.0 --activate
          corepack pnpm -C web install --frozen-lockfile

          ENVF=/etc/sabantuy/sabantuy.env
          DB=$(grep '^DATABASE_URL=' "$ENVF" | head -1 | sed 's/^DATABASE_URL=//;s/^"//;s/"$//')
          SECRET=$(grep '^PAYLOAD_SECRET=' "$ENVF" | head -1 | sed 's/^PAYLOAD_SECRET=//;s/^"//;s/"$//')
          if [ -z "$DB" ] || [ -z "$SECRET" ]; then echo "::error::нет DATABASE_URL/PAYLOAD_SECRET в $ENVF"; exit 1; fi

          echo "attach-orphans: ref=$REF mode=$MODE album=$ALBUM id=$AID"
          NODE_ENV=production SEED_MODE="$MODE" SEED_ALBUM="$ALBUM" SEED_ALBUM_ID="$AID" \
            DATABASE_URL="$DB" PAYLOAD_SECRET="$SECRET" \
            corepack pnpm -C web payload run src/seed/attachOrphanPhotos.ts

          echo "--- приёмка: фото в альбоме ---"
          psql "$DB" -tAc "SELECT count(*) FROM gallery_photos WHERE _parent_id = $AID;"
          REMOTE
      - name: Сайт после изменения (если был apply)
        if: inputs.mode == 'apply'
        run: |
          sleep 5
          curl -sS -o /dev/null -w 'gallery HTTP %{http_code}\n' --max-time 20 https://сабантуй.вмалмыже.рф/gallery || true