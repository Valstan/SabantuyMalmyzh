# Read-only probe прод-бокса: ретроспектива сезонного пика + факт диска (ADR-0001).
# Ничего не меняет на боксе — только читает метрики/логи и печатает в лог воркфлоу.
# Запуск: gh workflow run probe-prod.yml [-f since=2026-07-04]
name: Probe production (read-only)

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Дата (YYYY-MM-DD), за которую агрегировать nginx-логи'
        required: false
        default: '2026-07-04'

concurrency:
  group: probe-prod
  cancel-in-progress: false

# Явные права GITHUB_TOKEN вместо дефолтных (мандат brain 2026-07-31).
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_sabantuy
          chmod 600 ~/.ssh/id_ed25519_sabantuy
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host sabantuy
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_sabantuy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Probe box (read-only)
        run: |
          ssh sabantuy 'bash -s' "${{ inputs.since }}" <<'REMOTE'
          set +e   # каждый блок независим — собираем всё, что доступно
          SINCE="$1"
          # nginx-лог пишет время как 04/Jul/2026 — переводим дату в этот формат
          NGDATE=$(date -d "$SINCE" '+%d/%b/%Y' 2>/dev/null)

          echo "=====[ SYSTEM NOW ]====="
          date -u '+now UTC: %F %T'; uptime; free -m; df -h / | tail -2

          echo; echo "=====[ SERVICE sabantuy ]====="
          systemctl show sabantuy -p MainPID,NRestarts,ActiveEnterTimestamp,MemoryCurrent,MemoryPeak,MemoryMax 2>/dev/null
          # `comm`, а не `cmd`: полная командная строка несёт путь релиза на боксе,
          # а логи прогонов публичны (письмо brain 29.08). Для замера RSS/uptime
          # имени бинаря достаточно.
          ps -o pid,rss,etime,comm -p "$(systemctl show sabantuy -p MainPID --value)" 2>/dev/null

          echo; echo "=====[ JOURNAL since $SINCE: oom/restart/error markers ]====="
          # `-o cat` — только текст сообщения. В дефолтном формате journalctl
          # печатает хостнейм бокса В КАЖДОЙ СТРОКЕ; грепом по файлам репо такая
          # утечка не видна. Плюс редактор строк подключения: ошибка коннекта к БД
          # вываливает DATABASE_URL целиком, вместе с паролем.
          sudo journalctl -u sabantuy --since "$SINCE" --no-pager 2>/dev/null | grep -ciE 'oom|killed' | sed 's/^/oom-or-killed lines: /'
          sudo journalctl -u sabantuy --since "$SINCE" --no-pager -o cat 2>/dev/null | grep -iE 'started|stopped|oom|killed|fatal' | tail -20 | sed -E 's#([a-z0-9+]+://)[^:@/[:space:]]+:[^@[:space:]]+@#\1<REDACTED>@#g'
          sudo journalctl -k --since "$SINCE" --no-pager -o cat 2>/dev/null | grep -iE 'oom|out of memory' | tail -10

          # G234 (keep-alive гонка nginx↔Node): гонка возможна ТОЛЬКО если nginx
          # держит keep-alive к апстриму (upstream+keepalive, proxy_http_version 1.1,
          # Connection ""). Плюс фактическое значение KEEP_ALIVE_TIMEOUT у сервиса —
          # Next-standalone читает его из env, в репозитории этого не видно.
          echo; echo "=====[ G234: keep-alive nginx <-> Node ]====="
          echo "--- директивы nginx (upstream/keepalive/proxy) ---"
          # НЕ рекурсивно по conf.d и с `-h` (без имени файла): рекурсия печатала
          # в ПУБЛИЧНЫЙ лог конфиги всех соседей по боксу поимённо, вместе с
          # датами их бэкапов — то есть мы публиковали состав жильцов, и не свой,
          # а чужой (D-038, категория «состав жильцов бокса»). Замер 31.08 на
          # живом логе: 4 соседних проекта. Для вопроса G234 (есть ли у nginx
          # idle-пул к нашему апстриму) достаточно общего конфига и своего сайта.
          sudo grep -hnE 'upstream|keepalive|proxy_http_version|proxy_pass|Connection' /etc/nginx/nginx.conf 2>/dev/null | grep -v '^\s*#' | sed 's/^/[nginx.conf] /' | head -15
          sudo grep -hnE 'upstream|keepalive|proxy_http_version|proxy_pass|Connection' /etc/nginx/conf.d/sabantuy.conf 2>/dev/null | grep -v '^\s*#' | sed 's/^/[наш сайт] /' | head -15
          echo "--- env сервиса: KEEP_ALIVE_TIMEOUT ---"
          # Только `Environment=` (инлайновые пары), БЕЗ `EnvironmentFiles=`:
          # последний печатает путь env-файла в публичный лог. На вопрос
          # «задан ли KEEP_ALIVE_TIMEOUT» отвечает строка ниже, путь не нужен.
          systemctl show sabantuy -p Environment 2>/dev/null
          sudo grep -c '^KEEP_ALIVE_TIMEOUT=' /etc/sabantuy/sabantuy.env 2>/dev/null | sed 's/^/KEEP_ALIVE_TIMEOUT задан (строк): /'
          echo "--- ExecStart: обёртка graceful? (G234, амендмент-2) ---"
          # Сам ExecStart — это абсолютный путь к бинарю и к скрипту запуска.
          # Печатаем не его, а ответ на вопрос: запускаемся штатным server.js или
          # обёрткой, живущей вне бандла.
          systemctl show sabantuy -p ExecStart --value 2>/dev/null \
            | grep -oE '[A-Za-z0-9_.-]+\.(mjs|js)' | tail -1 | sed 's/^/точка входа: /'

          echo; echo "=====[ NGINX ACCESS $SINCE ($NGDATE) ]====="
          echo "--- /var/log/nginx содержимое ---"; sudo ls -la /var/log/nginx/ 2>&1 | head -20
          LOGS=$(sudo ls -1 /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null)
          ZLOGS=$(sudo ls -1 /var/log/nginx/access.log.*.gz 2>/dev/null)
          dump_logs() { for f in $LOGS; do sudo cat "$f" 2>/dev/null; done; for z in $ZLOGS; do sudo zcat "$z" 2>/dev/null; done; }
          DAY=$(dump_logs | grep -F "$NGDATE" )
          if [ -z "$DAY" ]; then
            echo "!!! записей за $NGDATE не найдено; доступные даты в логах:"
            dump_logs | sed -E 's/.*\[([0-9]+\/[A-Za-z]+\/[0-9]+):.*/\1/' | sort | uniq -c
          else
            printf '%s\n' "$DAY" > /tmp/probe-day.log
            echo "total requests: $(wc -l < /tmp/probe-day.log)"
            echo "unique IPs:     $(awk '{print $1}' /tmp/probe-day.log | sort -u | wc -l)"
            echo; echo "--- requests per hour ---"
            sed -E 's/.*\[[^:]+:([0-9]{2}):.*/\1/' /tmp/probe-day.log | sort | uniq -c
            echo; echo "--- peak minutes (top 10) ---"
            sed -E 's/.*\[[^:]+:([0-9]{2}:[0-9]{2}):.*/\1/' /tmp/probe-day.log | sort | uniq -c | sort -rn | head -10
            echo; echo "--- status codes ---"
            awk '{print $9}' /tmp/probe-day.log | sort | uniq -c | sort -rn
            echo; echo "--- top 25 paths (page-like, no static) ---"
            awk '{print $7}' /tmp/probe-day.log | grep -vE '\.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?|map|txt)([?].*)?$' | grep -v '^/_next/' | sort | uniq -c | sort -rn | head -25
            echo; echo "--- top 10 slow-ish signals: 499/5xx paths ---"
            awk '$9 ~ /^(499|5..)$/ {print $9, $7}' /tmp/probe-day.log | sort | uniq -c | sort -rn | head -10
            rm -f /tmp/probe-day.log
          fi

          echo; echo "=====[ DISK / MEDIA (ADR-0001) ]====="
          df -h /; echo
          # Пути берём от $HOME ssh-пользователя — литерала в отслеживаемом файле
          # не держим (D-038). Считаем ТОЛЬКО свой каталог: рекурсивный обход
          # общего каталога опубликовал бы соседей (#254).
          BASE="$HOME/sabantuy"; M="$BASE/shared/media"
          # `cut -f1` — `du -sh` печатает путь второй колонкой (логи публичны).
          du -sh "$M" 2>/dev/null | cut -f1 | sed 's/^/media размер: /'
          find "$M" -type f 2>/dev/null | wc -l | sed 's/^/media files: /'
          du -sh "$BASE/releases" 2>/dev/null | cut -f1 | sed 's/^/releases размер: /'

          echo "--- media: варианты Payload против оригиналов ---"
          # Payload именует size-варианты суффиксом -<W>x<H> перед расширением.
          find "$M" -type f -regextype posix-extended -regex '.*-[0-9]+x[0-9]+\.[A-Za-z0-9]+$' -printf '%s\n' 2>/dev/null \
            | awk '{n++; s+=$1} END {printf "варианты:  %5d файлов %8.1f МБ\n", n, s/1048576}'
          find "$M" -type f -regextype posix-extended ! -regex '.*-[0-9]+x[0-9]+\.[A-Za-z0-9]+$' -printf '%s\n' 2>/dev/null \
            | awk '{n++; s+=$1} END {printf "оригиналы: %5d файлов %8.1f МБ\n", n, s/1048576}'

          echo "--- media: по расширению ---"
          find "$M" -type f -printf '%f %s\n' 2>/dev/null \
            | awk '{e=$1; sub(/.*\./,"",e); n[e]++; b[e]+=$2} END {for (x in n) printf "%-6s %5d файлов %8.1f МБ\n", x, n[x], b[x]/1048576}' \
            | sort -k4 -rn | head -12

          echo "--- media: 10 самых крупных файлов ---"
          find "$M" -type f -printf '%s %f\n' 2>/dev/null | sort -rn | head -10 \
            | awk '{printf "%8.2f МБ  %s\n", $1/1048576, $2}'

          echo "--- media: оригиналы по источнику (префикс имени) ---"
          find "$M" -type f -regextype posix-extended ! -regex '.*-[0-9]+x[0-9]+\.[A-Za-z0-9]+$' -printf '%f %s\n' 2>/dev/null \
            | awk '{p=$1; sub(/-.*/,"",p); n[p]++; b[p]+=$2} END {for (x in n) printf "%-14s %5d файлов %8.1f МБ\n", x, n[x], b[x]/1048576}' \
            | sort -k4 -rn | head -12

          # Горячие оригиналы или холодный архив? Код везде делает
          # `sizes?.X?.url || media.url`, то есть фолбэк на оригинал существует.
          # Вопрос «срабатывает ли он в жизни» решается только логом.
          # ⚠️ access.log ОБЩИЙ на бокс. Счётчики агрегатные — чужие строки их
          # разве что завысят. Но имена файлов печатаем ТОЛЬКО по своим
          # префиксам: иначе опубликуем медиа соседей (#254).
          echo "--- media: период, покрытый текущим access.log ---"
          sudo awk 'NR==1 || NR%1000000==0 {print} END {print}' /var/log/nginx/access.log 2>/dev/null \
            | sed -E 's/.*\[([0-9]+\/[A-Za-z]+\/[0-9]+):.*/\1/' | sort -u | head -4

          echo "--- media: что реально запрашивают ---"
          sudo awk '$7 ~ /\/api\/media\/file\// {
              if ($7 ~ /-[0-9]+x[0-9]+\.[A-Za-z0-9]+([?].*)?$/) { v++; vb += $10 } else { o++; ob += $10 }
            } END {
              printf "варианты:  %7d запросов %9.1f МБ\n", v, vb/1048576
              printf "оригиналы: %7d запросов %9.1f МБ\n", o, ob/1048576
            }' /var/log/nginx/access.log 2>/dev/null

          echo "--- media: 10 самых запрашиваемых оригиналов (только наши префиксы) ---"
          sudo awk '$7 ~ /\/api\/media\/file\// && $7 !~ /-[0-9]+x[0-9]+\./ {print $7}' /var/log/nginx/access.log 2>/dev/null \
            | sed 's|.*/||' \
            | grep -E '^(fotostena|seed|vkobzor|podgotovka|obzor2|bus|afisha)' \
            | sort | uniq -c | sort -rn | head -10

          echo "--- media: подкаталоги верхнего уровня ---"
          du -sh "$M"/*/ 2>/dev/null | sed "s|$M/||" | sort -h | tail -15 || echo "(подкаталогов нет — плоская раскладка)"
          echo; echo "=====[ POSTGRES SIZE ]====="
          sudo -u postgres psql -tAc "SELECT pg_size_pretty(pg_database_size('sabantuy'));" 2>/dev/null || echo "(pg size недоступен без sudo -u postgres)"

          # Полнота size-вариантов. Код фронта везде делает `sizes?.X?.url ||
          # media.url` — где варианта нет, отдаётся ОРИГИНАЛ. Замер по логу за
          # 04.06–01.09: оригиналы дали 51 % байт медиа-трафика. Вопрос: это
          # штатный фолбэк (Payload не генерит вариант шире исходника) или
          # дефект (вариант должен был быть, но его нет).
          echo; echo "=====[ MEDIA: полнота size-вариантов ]====="
          sudo -u postgres psql -d sabantuy -tAF' ' -c "
            SELECT 'нет wide:', count(*) FILTER (WHERE sizes_wide_filename IS NULL),
                   'нет card:', count(*) FILTER (WHERE sizes_card_filename IS NULL),
                   'нет thumb:', count(*) FILTER (WHERE sizes_thumbnail_filename IS NULL),
                   'всего:', count(*)
            FROM media;" 2>/dev/null || echo "(запрос недоступен)"

          echo "--- нет wide: объяснимо шириной исходника или нет? ---"
          # width < 1920 => Payload вариант не делает, фолбэк на оригинал штатный.
          sudo -u postgres psql -d sabantuy -tAF' ' -c "
            SELECT CASE WHEN width >= 1920 THEN 'ШИРЕ 1920 — вариант должен был быть'
                        ELSE 'уже 1920 — фолбэк штатный' END AS verdict,
                   count(*), pg_size_pretty(sum(filesize)::bigint)
            FROM media WHERE sizes_wide_filename IS NULL GROUP BY 1;" 2>/dev/null || echo "(запрос недоступен)"

          # Картинки внутри rich-text рендерятся через lexical-lite uploadToHtml,
          # который берёт value.url — ОРИГИНАЛ, без обращения к sizes. Сколько
          # весит эта разница там, где вариант wide существует и не используется.
          echo "--- цена отдачи оригинала вместо wide (там, где wide есть) ---"
          sudo -u postgres psql -d sabantuy -tAF' ' -c "
            SELECT count(*) AS files,
                   pg_size_pretty(sum(filesize)::bigint) AS originals,
                   pg_size_pretty(sum(sizes_wide_filesize)::bigint) AS wide_variants
            FROM media WHERE sizes_wide_filename IS NOT NULL;" 2>/dev/null || echo "(запрос недоступен)"

          echo "--- seed-картинки (они же горячие в логе): оригинал против wide ---"
          sudo -u postgres psql -d sabantuy -tAF' ' -c "
            SELECT filename, width,
                   pg_size_pretty(filesize::bigint) AS original,
                   coalesce(pg_size_pretty(sizes_wide_filesize::bigint), 'нет wide') AS wide
            FROM media WHERE filename LIKE 'seed-%'
            ORDER BY filesize DESC LIMIT 13;" 2>/dev/null || echo "(запрос недоступен)"

          echo "--- топ-10 по весу среди тех, у кого нет wide ---"
          sudo -u postgres psql -d sabantuy -tAF' ' -c "
            SELECT filename, width, pg_size_pretty(filesize::bigint)
            FROM media WHERE sizes_wide_filename IS NULL
            ORDER BY filesize DESC NULLS LAST LIMIT 10;" 2>/dev/null || echo "(запрос недоступен)"
          exit 0
          REMOTE
