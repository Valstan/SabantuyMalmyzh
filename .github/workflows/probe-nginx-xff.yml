name: Probe nginx XFF (read-only)

# Проверка medium-находки #057: перезаписывает ли nginx входящий X-Forwarded-For.
# $remote_addr = перезапись (спуфинг невозможен); $proxy_add_x_forwarded_for =
# дополнение (первое значение от клиента — rate-limit обходится).

on:
  workflow_dispatch:

concurrency:
  group: sabantuy-prod-ssh
  cancel-in-progress: false

permissions:
  contents: read

env:
  # G315: глушим stderr ssh/scp-клиента (хост не должен уезжать в публичный лог)
  BASH_ENV: ${{ github.workspace }}/.github/scripts/ssh-quiet.sh

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_sabantuy
          chmod 600 ~/.ssh/id_ed25519_sabantuy
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host sabantuy
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_sabantuy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config
      - name: nginx XFF check
        run: |
          ssh sabantuy 'bash -s' < .github/scripts/nginx-xff-check.sh
