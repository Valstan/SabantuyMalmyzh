# Гейты на PR — до сих пор их в CI НЕ БЫЛО ВООБЩЕ.
#
# Ревизия #104 (2026-08-10) вскрыла: `gh pr checks` у нас всегда отвечал
# «no checks reported», то есть «зелёный CI» из мандата #027 существовал только
# как локальный прогон агента на своей машине. Это ровно ложная санкция, о которой
# #104 и написан: авто-мерж происходил на основании гейта, который никто, кроме
# агента, не наблюдал.
#
# Здесь только быстрые проверки, не требующие БД (build с Postgres гоняется в
# deploy-prod.yml после мержа). Задача — чтобы гейт был наблюдаемым и чужим.
name: Gates (secrets · typecheck · lint · verify)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 обязателен сканеру секретов ниже. С дефолтной глубиной 1
      # сканируется ровно один коммит, и гейт зелёный по построению.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Сканер секретов — мандат brain 2026-08-17, эскалация 23.08/25.08.
      # Стоит ПЕРВЫМ шагом: не требует node/pnpm и валит job за секунды,
      # не тратя две минуты на установку зависимостей.
      #
      # Бинарь с явными флагами, а не `gitleaks-action` (приём Казанской): все три
      # обязательных свойства видны в самом файле и не зависят от умолчаний обёртки —
      #   1) `fetch-depth: 0` выше       → сканируется история, а не один коммит;
      #   2) `--exit-code 1`             → находка ВАЛИТ job;
      #   3) `--redact`                  → значение НЕ попадает в публичный лог
      #                                    (у публичного репо логи прогонов публичны).
      # Правила под наши классы (ВК/строки подключения) — в `.gitleaks.toml`:
      # дефолтные 195 правил ВК-токен не видят вовсе (#170).
      - name: Сканер секретов (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          # Пин версии + сверка контрольной суммы: без неё шаг молча съест
          # подменённый артефакт релиза.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --no-banner \
            --verbose

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Второй сканер, другой предмет: gitleaks ищет ЗНАЧЕНИЯ секретов, этот — recon-
      # литералы (хосты, серверные пути, логины, отпечатки бокса). Их не видит ни одна
      # другая проверка, и именно поэтому аудит D-038 трижды приходил ложно-чистым:
      # чинили руками, машиной не закрепляли, и каждая починка регрессировала при
      # первом же новом воркфлоу или письме.
      #
      # Красный — на НОВОМ вхождении, а не на существующем: сознательно оставленные
      # места лежат в .github/recon-baseline.json с причинами. Скан ищет по ФОРМЕ, и
      # baseline тоже не содержит значений (#191). Свой контроль метода (#262) внутри:
      # 7 положительных образцов и 10 отрицательных, не сработал — красный до сравнения.
      - name: Сканер recon-литералов (D-038)
        run: node .github/scripts/recon-scan.mjs

      # `corepack enable` обязателен: без него шима pnpm нет в PATH и следующий шаг
      # падает с `pnpm: command not found` (поймано первым же красным прогоном).
      - name: Включить corepack + pnpm 10 (НЕ 11 — несовместим)
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Установить зависимости
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: web
        run: pnpm typecheck

      # `--max-warnings 0` внутри скрипта: без него next lint отдаёт exit 0
      # при предупреждениях, и зелёный значок перестаёт значить «нарушений нет».
      - name: lint
        working-directory: web
        run: pnpm lint

      # Мутационная приёмка клиента vault (#114): allowlist без негативного
      # прогона — декорация. Сети и БД не требует.
      - name: Приёмка клиента vault (негативный прогон allowlist)
        working-directory: web
        run: pnpm verify:secrets
