# Конфигурация сканера секретов (мандат brain 2026-08-17, письма 23.08 и 25.08).
#
# ПОЧЕМУ НЕ ХВАТАЕТ ДЕФОЛТНЫХ ПРАВИЛ (#170, замер Сарафана):
# 195 встроенных правил gitleaks НЕ ВИДЯТ ВК-токен вовсе и пропускают
# Telegram-токен внутри URL. У нас в проекте ходят ровно ВК-секреты
# (`VK_SERVICE_TOKEN`, `VK_CLIENT_SECRET`, пользовательский токен фотостены) —
# то есть сканер «из коробки» был бы зелёным на том самом классе, ради
# которого его ставят. Ниже — свои правила под наши классы.
#
# ПРАВИЛА ПО ФОРМЕ, А НЕ ПО ЗНАЧЕНИЮ (#191): denylist с настоящими значениями
# публикует ровно то, что запрещает. Ни одного реального токена в этом файле нет
# и быть не должно — только описания формы.
#
# ЯМЫ, УЧТЁННЫЕ В РЕГУЛЯРКАХ:
#   G262 — ведущий `\b` молча пропускает токен внутри URL. Поэтому границы слева
#          заданы явно через `(?:^|[^...])` + `secretGroup`, а не через `\b`.
#   G258 — примеры из документации вендоров лежат в дефолтном allowlist gitleaks;
#          приёмка такими значениями «проходит» зелёной. Подсадной для приёмки
#          берём случайный и под названным правилом.

title = "SabantuyMalmyzh secret scanning"

[extend]
# Дефолтные 195 правил берём как базу (SSH-ключи, AWS, github-pat, generic-api-key),
# свои — сверху.
useDefault = true

# ─────────────────────────────────────────────────────────────────────────────
# ВК — наш основной класс. Два формата токена.
# ─────────────────────────────────────────────────────────────────────────────

[[rules]]
id = "vk-access-token-v1"
description = "ВК access token нового формата (vk1.a.*)"
# Префикс `vk1.a.` самодостаточен — границы не нужны, внутри URL ловится так же.
regex = '''vk1\.a\.[A-Za-z0-9_-]{50,}'''
keywords = ["vk1.a."]
tags = ["vk", "token"]

[[rules]]
id = "vk-token-hex85"
description = "ВК access/service token старого формата (85 hex)"
# БЕЗ ведущего `\b` (G262): слева — любой не-hex символ либо начало строки, что
# покрывает и `access_token=<токен>` в URL, и `VK_TOKEN="<токен>"`, и колонку
# `access_token` в SQL-сиде (форма находки Гоньбы 23.08).
regex = '''(?:^|[^0-9a-fA-F])([0-9a-f]{85})(?:[^0-9a-fA-F]|$)'''
secretGroup = 1
tags = ["vk", "token"]

# ─────────────────────────────────────────────────────────────────────────────
# Telegram — в портфеле класс реально утекал (в URL-форме). У нас TG сейчас не
# ходит, но правило дешёвое, а появление бота — вопрос одной сессии.
# ─────────────────────────────────────────────────────────────────────────────

[[rules]]
id = "telegram-bot-token-anywhere"
description = "Telegram bot token, в том числе внутри URL api.telegram.org/bot<token>/"
# `bot123456789:AAA...` — слева от цифр стоит `t`, поэтому класс `[^0-9]` ловит,
# а `\b` — нет (G262).
regex = '''(?:^|[^0-9])([0-9]{8,10}:[A-Za-z0-9_-]{35})'''
secretGroup = 1
tags = ["telegram", "token"]

# ─────────────────────────────────────────────────────────────────────────────
# Строки подключения с паролем внутри. Дефолтных правил под них нет, а у нас
# `DATABASE_URL` и SMTP — ровно этой формы, и они же приезжают в лог при падении
# подключения (письмо brain 29.08, механизм 3).
# ─────────────────────────────────────────────────────────────────────────────

[[rules]]
id = "connection-uri-with-password"
description = "URI подключения с паролем в открытом виде (postgres/mysql/mongodb/redis/amqp/smtp)"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|smtps?)://[^\s:@/]{1,64}:([^\s:@/]{3,})@'''
secretGroup = 1
tags = ["database", "credentials"]

  [[rules.allowlists]]
  description = "Локальные dev-строки без секрета (web/.env.example, README, docker-compose)"
  # По форме: пароль-заглушка к localhost. Настоящий прод-URI сюда не попадает —
  # у него другой хост.
  regexes = ['''://[^\s@]+@(?:localhost|127\.0\.0\.1|db|postgres)(?::[0-9]+)?/''']
  regexTarget = "line"

# ─────────────────────────────────────────────────────────────────────────────
# Yandex Object Storage — наши S3-ключи под UGC (S3_ACCESS_KEY_ID /
# S3_SECRET_ACCESS_KEY). Дефолтное правило `aws-access-token` их не покрывает:
# у Яндекса свой префикс.
# ─────────────────────────────────────────────────────────────────────────────

[[rules]]
id = "yandex-cloud-static-key"
description = "Статический ключ Yandex Cloud / Object Storage (YC*)"
regex = '''(?:^|[^A-Za-z0-9_-])(YC[A-Za-z0-9_-]{36,48})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
tags = ["yandex", "s3"]

# ─────────────────────────────────────────────────────────────────────────────
# Глобальный allowlist. Держать МИНИМАЛЬНЫМ и по ТОЧНОМУ пути (мандат 23.08):
# широкое исключение выключает гейт молча.
# ─────────────────────────────────────────────────────────────────────────────

[allowlist]
description = "Точечные исключения"
paths = [
  # Лок-файл pnpm: длинные integrity-хеши sha512, ни одного секрета по природе.
  '''web/pnpm-lock\.yaml$''',
]
